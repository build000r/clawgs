name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify and publish, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-publish:
    name: Verify and publish crate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Validate tag matches Cargo version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          expected="v${version}"
          if [[ "${RELEASE_TAG}" != "${expected}" ]]; then
            echo "tag ${RELEASE_TAG} does not match Cargo version ${version}" >&2
            exit 1
          fi

      - name: Check format
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke check release binary
        run: bash scripts/check.sh

      - name: Verify package contents
        run: |
          set -euo pipefail
          package_files="${RUNNER_TEMP}/package-files.txt"
          cargo package --locked --list > "${package_files}"
          required=(
            "README.md"
            "LICENSE"
            "CHANGELOG.md"
            "examples/demo/claude-sample.jsonl"
            "examples/demo/codex-sample.jsonl"
            "references/clawgs.v2.schema.json"
            "references/clawgs.emit.v2.schema.json"
          )
          for path in "${required[@]}"; do
            if ! grep -Fxq "${path}" "${package_files}"; then
              echo "missing package file: ${path}" >&2
              exit 1
            fi
          done
          forbidden_patterns=(
            '^\.github/'
            '^\.mcp\.json$'
            '^\.beads(/|$)'
            '^\.buildooor(/|$)'
            '^\.claude(/|$)'
            '^\.codex(/|$)'
            '^\.ntm(/|$)'
            '^\.ubs(/|$)'
            '^\.drift(/|$)'
            '^\.apr(/|$)'
            '(^|/)\.env$'
            '(^|/)[^/]+\.bak$'
            '(^|/)\.DS_Store$'
          )
          for pattern in "${forbidden_patterns[@]}"; do
            if grep -Eq "${pattern}" "${package_files}"; then
              echo "forbidden package path matched ${pattern}:" >&2
              grep -E "${pattern}" "${package_files}" >&2
              exit 1
            fi
          done

      - name: Dry-run publish
        run: cargo publish --locked --dry-run

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            echo "Skipping crates.io publish for prerelease tag ${RELEASE_TAG}."
            exit 0
          fi
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; verification completed without publishing."
            exit 0
          fi
          cargo publish --locked
