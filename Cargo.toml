[package]
name = "clawgs"
version = "0.1.0"
edition = "2021"
description = "Extract structured JSON snapshots from Claude Code and Codex JSONL transcripts"
license = "MIT"
readme = "README.md"
repository = "https://github.com/build000r/clawgs"
homepage = "https://github.com/build000r/clawgs"
documentation = "https://docs.rs/clawgs"
keywords = ["claude", "codex", "jsonl", "transcripts", "cli"]
categories = ["command-line-utilities", "parser-implementations", "development-tools"]
exclude = [
    "target/",
    ".mutate/",
    "mutants.out/",
    "lcov.info",
    "scripts/",
    "tests/",
    "docs/",
    "references/",
    "Makefile",
    "SKILL.md",
]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
