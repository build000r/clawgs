[package]
name = "clawgs"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["build000r <buildooor@gmail.com>"]
description = "Extract structured JSON snapshots from Claude Code and Codex JSONL transcripts"
license = "MIT"
readme = "README.md"
repository = "https://github.com/build000r/clawgs"
homepage = "https://github.com/build000r/clawgs"
documentation = "https://docs.rs/clawgs"
keywords = ["claude", "codex", "jsonl", "transcripts", "cli"]
categories = ["command-line-utilities", "parser-implementations", "development-tools"]
exclude = [
    "target/",
    ".github/",
    "CHANGELOG_RESEARCH.md",
    "refactor/",
    ".mutate/",
    "mutants.out/",
    "lcov.info",
    "scripts/",
    "tests/",
    "docs/",
    "Makefile",
    "SKILL.md",
]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jsonschema = { version = "0.17", default-features = false }
tempfile = "3"

# Release profile tuned for the long-lived `clawgs emit --stdio` daemon used
# by swimmers (spawned once, then sync every 2s). Smaller resident footprint
# and less code-path dispersion matter more than compile time here.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false

# Attribution-resolving variant: full debuginfo + no LTO so samply can attribute
# chrono parse symbols to their true callsites. Never used for shipping.
[profile.release-perf-attr]
inherits = "release-perf"
lto = "off"
codegen-units = 16
debug = 2
